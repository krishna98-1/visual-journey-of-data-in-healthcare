<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: "Anthropic Sans", sans-serif; }

.chart-wrap {
  width: 100%;
  overflow-x: auto;
  padding: 0 0 24px 0;
}

svg {
  display: block;
  min-width: 1100px;
}

/* Node styles */
.node-hospital { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
.node-hospital text { fill: #3C3489; }
.node-lab { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
.node-lab text { fill: #085041; }
.node-research { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; }
.node-research text { fill: #633806; }
.node-insurance { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.8; }
.node-insurance text { fill: #0C447C; }
.node-pharma { fill: #FBEAF0; stroke: #993556; stroke-width: 0.8; }
.node-pharma text { fill: #72243E; }
.node-cloud { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
.node-cloud text { fill: #444441; }
.node-device { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.8; }
.node-device text { fill: #27500A; }
.node-patient { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 1.2; }
.node-patient text { fill: #501313; }
.node-death { fill: #2C2C2A; stroke: #444441; stroke-width: 0.8; }
.node-death text { fill: #D3D1C7; }
.node-consent { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.8; }
.node-consent text { fill: #4A1B0C; }
.node-breach { fill: #FCE0E0; stroke: #E24B4A; stroke-width: 1; }
.node-breach text { fill: #501313; }

.section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }

/* Arrow styles */
.arr-main { stroke: #888780; stroke-width: 1.2; fill: none; }
.arr-consent { stroke: #D85A30; stroke-width: 1; fill: none; stroke-dasharray: 5,3; }
.arr-extract { stroke: #185FA5; stroke-width: 1; fill: none; stroke-dasharray: 3,3; }
.arr-risk { stroke: #E24B4A; stroke-width: 1.2; fill: none; }
.arr-cloud { stroke: #5F5E5A; stroke-width: 0.8; fill: none; stroke-dasharray: 4,2; }

text.title { font-size: 13px; font-weight: 500; fill: var(--color-text-primary, #1a1a1a); }
text.sub { font-size: 10px; fill: var(--color-text-secondary, #5a5a5a); }
text.micro { font-size: 9px; fill: var(--color-text-secondary, #5a5a5a); }
text.bold11 { font-size: 11px; font-weight: 500; }
text.bold10 { font-size: 10px; font-weight: 500; }

.lane-bg-hosp { fill: #EEEDFE; fill-opacity: 0.15; }
.lane-bg-lab { fill: #E1F5EE; fill-opacity: 0.15; }
.lane-bg-research { fill: #FAEEDA; fill-opacity: 0.15; }
.lane-bg-insure { fill: #E6F1FB; fill-opacity: 0.15; }
.lane-bg-pharma { fill: #FBEAF0; fill-opacity: 0.15; }
.lane-bg-cloud { fill: #F1EFE8; fill-opacity: 0.2; }

.zone-label { font-size: 9px; font-weight: 500; fill: #888780; letter-spacing: 0.4px; }
</style>
</head>

<!-- Data birth sources row -->
<!-- Source 1: Walk-in -->

<text x="155" y="409" text-anchor="middle" class="micro" fill="#534AB7">Data born: Paper + Digital form</text>

<text x="365" y="341" text-anchor="middle" class="bold11" fill="#3C3489">Emergency admission</text>

<text x="365" y="383" text-anchor="middle" class="micro" fill="#534AB7">Next-of-kin contact gathered</text>
<text x="365" y="396" text-anchor="middle" class="micro" fill="#534AB7">Implied consent for treatment</text>
<text x="365" y="409" text-anchor="middle" class="micro" fill="#534AB7">Data born: Verbal + Device</text>

<!-- Source 3: Telemedicine -->
<rect x="480" y="320" width="190" height="100" rx="6" class="node-hospital"/>
<text x="575" y="341" text-anchor="middle" class="bold11" fill="#3C3489">Telemedicine / app</text>
<text x="575" y="357" text-anchor="middle" class="micro" fill="#534AB7">Doctor-on-call / e-Sanjeevani</text>
<text x="575" y="370" text-anchor="middle" class="micro" fill="#534AB7">Video session metadata</text>
<text x="575" y="383" text-anchor="middle" class="micro" fill="#534AB7">Chat + prescription logs</text>
<text x="575" y="396" text-anchor="middle" class="micro" fill="#534AB7">IP address, device ID captured</text>
<text x="575" y="409" text-anchor="middle" class="micro" fill="#534AB7">Data born: Cloud SaaS platform</text>

<text x="785" y="341" text-anchor="middle" class="bold11" fill="#27500A">Medical device / IoT</text>
<text x="785" y="357" text-anchor="middle" class="micro" fill="#3B6D11">ECG · EEG · Pulse Ox</text>
<text x="785" y="370" text-anchor="middle" class="micro" fill="#3B6D11">Glucose monitor · BP cuff</text>

<text x="785" y="409" text-anchor="middle" class="micro" fill="#3B6D11">Data born: Sensor stream (HL7/FHIR)</text>

<text x="995" y="341" text-anchor="middle" class="bold11" fill="#27500A">Diagnostic imaging</text>
<text x="995" y="357" text-anchor="middle" class="micro" fill="#3B6D11">X-Ray · CT · MRI · Ultrasound</text>
<text x="995" y="370" text-anchor="middle" class="micro" fill="#3B6D11">DICOM file generated</text>
<text x="995" y="383" text-anchor="middle" class="micro" fill="#3B6D11">Embedded patient metadata</text>
<text x="995" y="396" text-anchor="middle" class="micro" fill="#3B6D11">PACS system stores locally</text>
<text x="995" y="409" text-anchor="middle" class="micro" fill="#3B6D11">Data born: DICOM standard</text>

<text x="1205" y="357" text-anchor="middle" class="micro" fill="#0F6E56">Blood · Urine · Tissue</text>
<text x="1205" y="370" text-anchor="middle" class="micro" fill="#0F6E56">Barcode linked to patient ID</text>
<text x="1205" y="383" text-anchor="middle" class="micro" fill="#0F6E56">Chain-of-custody log starts</text>
<text x="1205" y="396" text-anchor="middle" class="micro" fill="#0F6E56">LIS system creates record</text>
<text x="1205" y="409" text-anchor="middle" class="micro" fill="#0F6E56">Data born: LIS / LIMS barcode</text>

<text x="1415" y="357" text-anchor="middle" class="micro" fill="#993556">Paper Rx or e-Prescription</text>
<text x="1415" y="370" text-anchor="middle" class="micro" fill="#993556">Drug name · dosage · duration</text>
<text x="1415" y="383" text-anchor="middle" class="micro" fill="#993556">Patient ID cross-linked</text>
<text x="1415" y="396" text-anchor="middle" class="micro" fill="#993556">Dispensing record created</text>
<text x="1415" y="409" text-anchor="middle" class="micro" fill="#993556">Data born: Pharmacy POS / ERP</text>

<text x="1625" y="409" text-anchor="middle" class="micro" fill="#185FA5">Data born: Insurer CRM / portal</text>

<!-- ============================================================
     PHASE 2: CONSENT LAYER
     ============================================================ -->
<rect x="40" y="436" width="1620" height="24" rx="4" fill="#993C1D"/>
<text x="860" y="452" text-anchor="middle" font-size="11" font-weight="500" fill="#FAECE7">PHASE 2 — CONSENT &amp; LEGAL BASIS (DPDP §6 · GDPR Art.6/9 · HIPAA §164.508)</text>

<!-- Consent nodes -->
<rect x="60" y="472" width="220" height="90" rx="6" class="node-consent"/>
<text x="170" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Explicit written consent</text>
<text x="170" y="506" text-anchor="middle" class="micro" fill="#993C1D">DPDP §6 — must be free, specific</text>
<text x="170" y="519" text-anchor="middle" class="micro" fill="#993C1D">informed and unambiguous</text>
<text x="170" y="532" text-anchor="middle" class="micro" fill="#993C1D">Consent manager registry entry</text>
<text x="170" y="545" text-anchor="middle" class="micro" fill="#993C1D">Revocable at any time</text>
<text x="170" y="558" text-anchor="middle" class="micro" fill="#993C1D">GDPR Art.9 — Special category data</text>

<rect x="300" y="472" width="220" height="90" rx="6" class="node-consent"/>
<text x="410" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Implied / treatment consent</text>
<text x="410" y="506" text-anchor="middle" class="micro" fill="#993C1D">Emergency &amp; acute care exception</text>
<text x="410" y="519" text-anchor="middle" class="micro" fill="#993C1D">DPDP §7 — Legitimate use</text>
<text x="410" y="532" text-anchor="middle" class="micro" fill="#993C1D">Not for secondary purposes</text>
<text x="410" y="545" text-anchor="middle" class="micro" fill="#993C1D">HIPAA Treatment/Payment/Ops</text>
<text x="410" y="558" text-anchor="middle" class="micro" fill="#993C1D">TPO exception applies</text>

<rect x="540" y="472" width="220" height="90" rx="6" class="node-consent"/>
<text x="650" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Research consent waiver</text>
<text x="650" y="506" text-anchor="middle" class="micro" fill="#993C1D">Ethics board / IRB approval req.</text>
<text x="650" y="519" text-anchor="middle" class="micro" fill="#993C1D">Anonymisation mandatory</text>
<text x="650" y="532" text-anchor="middle" class="micro" fill="#993C1D">DPDP Schedule — research exempt</text>
<text x="650" y="545" text-anchor="middle" class="micro" fill="#993C1D">GDPR Art.89 — Research derogation</text>
<text x="650" y="558" text-anchor="middle" class="micro" fill="#993C1D">ICMR Bioethics Guidelines 2023</text>

<rect x="780" y="472" width="220" height="90" rx="6" class="node-consent"/>
<text x="890" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Statutory disclosure</text>
<text x="890" y="506" text-anchor="middle" class="micro" fill="#993C1D">Court order / law enforcement</text>
<text x="890" y="519" text-anchor="middle" class="micro" fill="#993C1D">Notifiable disease reporting</text>
<text x="890" y="532" text-anchor="middle" class="micro" fill="#993C1D">DPDP §17 — State exemptions</text>
<text x="890" y="545" text-anchor="middle" class="micro" fill="#993C1D">IT Act §69 — Surveillance order</text>
<text x="890" y="558" text-anchor="middle" class="micro" fill="#993C1D">No patient consent required</text>

<rect x="1020" y="472" width="220" height="90" rx="6" class="node-consent"/>
<text x="1130" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Insurance / TPA authorisation</text>
<text x="1130" y="506" text-anchor="middle" class="micro" fill="#993C1D">Policy T&amp;C embed consent</text>
<text x="1130" y="519" text-anchor="middle" class="micro" fill="#993C1D">Pre-auth for procedures</text>
<text x="1130" y="532" text-anchor="middle" class="micro" fill="#993C1D">IRDAI 2024 Health Data Circular</text>
<text x="1130" y="545" text-anchor="middle" class="micro" fill="#993C1D">Claim adjudication access</text>
<text x="1130" y="558" text-anchor="middle" class="micro" fill="#993C1D">Patient right to restrict</text>

<rect x="1260" y="472" width="220" height="90" rx="6" class="node-consent"/>
<text x="1370" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Pharmacy dispensing consent</text>
<text x="1370" y="506" text-anchor="middle" class="micro" fill="#993C1D">Prescription = legal basis</text>
<text x="1370" y="519" text-anchor="middle" class="micro" fill="#993C1D">OTC — implied consent only</text>
<text x="1370" y="532" text-anchor="middle" class="micro" fill="#993C1D">CDSCO Drug Rules 1945 apply</text>
<text x="1370" y="545" text-anchor="middle" class="micro" fill="#993C1D">Pharmacovigilance exception</text>
<text x="1370" y="558" text-anchor="middle" class="micro" fill="#993C1D">3rd party share requires consent</text>

<rect x="1500" y="472" width="160" height="90" rx="6" class="node-consent"/>
<text x="1580" y="491" text-anchor="middle" class="bold11" fill="#4A1B0C">Consent withdrawal</text>
<text x="1580" y="506" text-anchor="middle" class="micro" fill="#993C1D">DPDP §13 — Right to withdraw</text>
<text x="1580" y="519" text-anchor="middle" class="micro" fill="#993C1D">Erasure request follows</text>
<text x="1580" y="532" text-anchor="middle" class="micro" fill="#993C1D">Fiduciary must cease use</text>
<text x="1580" y="545" text-anchor="middle" class="micro" fill="#993C1D">Retention schedule applies</text>
<text x="1580" y="558" text-anchor="middle" class="micro" fill="#993C1D">GDPR Art.17 Right to erasure</text>

<!-- ============================================================
     PHASE 3: HOSPITAL DATA ECOSYSTEM
     ============================================================ -->
<rect x="40" y="580" width="1620" height="24" rx="4" fill="#534AB7"/>
<text x="860" y="596" text-anchor="middle" font-size="11" font-weight="500" fill="#EEEDFE">PHASE 3 — HOSPITAL DATA ECOSYSTEM (Data Fiduciary #1)</text>

<!-- Hospital internal systems -->
<rect x="60" y="616" width="380" height="140" rx="6" fill="#EEEDFE" fill-opacity="0.3" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="4,2"/>
<text x="250" y="634" text-anchor="middle" class="bold10" fill="#3C3489">CLINICAL SYSTEMS</text>

<rect x="70" y="644" width="170" height="70" rx="5" class="node-hospital"/>
<text x="155" y="662" text-anchor="middle" class="bold10" fill="#3C3489">EMR / EHR System</text>
<text x="155" y="676" text-anchor="middle" class="micro" fill="#534AB7">SOAP notes · diagnoses</text>
